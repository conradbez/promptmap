[project]
name = "promptmap-code"
version = "0.1.0"
description = "pm-code: a CLI agent (mini-swe-agent based) that builds promptmap pipelines of chat and coding_agent nodes through tool calls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "promptmap>=0.9.1",
    # model_type="chat" lives here.
    "promptmap-extra-model-kinds>=0.8.0",
    "mini-swe-agent>=2.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.urls]
Repository = "https://github.com/conradbez/promptmap"

[project.scripts]
pm-code = "promptmap_code.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
promptmap = { path = "..", editable = true }
promptmap-extra-model-kinds = { path = "../promptmap-extra-model-kinds", editable = true }
