[project]
name = "promptmap-extra-model-kinds"
version = "0.7.1"
description = "Extra promptmap model kinds (execute_python, agent_multi_harness (mini-swe-agent / opencode / pi), python_modal, agent_modal, agent37) and RAG kinds (brave_search, gemini_search, openai_search, anthropic_search)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "promptmap>=0.7.0",
    "modal>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "openai>=2.26",
    "anthropic>=1.15",
]

[project.urls]
Repository = "https://github.com/conradbez/promptmap"

[project.entry-points."promptmap.model_kinds"]
python_modal = "promptmap_extra_model_kinds.modal_exec"
agent_modal = "promptmap_extra_model_kinds.agent_exec"
agent37 = "promptmap_extra_model_kinds.agent37_exec"
execute_python = "promptmap_extra_model_kinds.python_exec"
agent_multi_harness = "promptmap_extra_model_kinds.agent_multi_harness_exec"

[project.entry-points."promptmap.rag_kinds"]
brave_search = "promptmap_extra_model_kinds.brave_search"
gemini_search = "promptmap_extra_model_kinds.gemini_search"
openai_search = "promptmap_extra_model_kinds.openai_search"
anthropic_search = "promptmap_extra_model_kinds.anthropic_search"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
promptmap = { path = "..", editable = true }
