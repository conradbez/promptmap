[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptmap"
version = "0.8.6"
description = "A dbt-inspired prompt orchestration tool for LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "networkx>=3.0",
    "rich>=13.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "mini-swe-agent>=2.0",
    # Pinned exactly: two litellm releases on PyPI were compromised (March
    # 2026).  Bump deliberately after checking the release: wheel RECORD
    # hashes, no .pth files, diff of new code, and network calls (strace)
    # during import + a tool-calling request.  1.109.1 checked 2026-11-14.
    # No [mcp] extra: litellm doesn't import mcp on tool-calling requests
    # (checked against a local OpenAI/Anthropic stub with mcp unimportable).
    "litellm==1.109.1",
    "tree-sitter-language-pack>=1.23",
    "questionary>=2.1,<3",
]

[project.urls]
Homepage = "https://github.com/conradbez/promptmap"
Repository = "https://github.com/conradbez/promptmap"

[project.optional-dependencies]
extras = ["promptmap-extra-model-kinds; python_version >= '3.11'"]
# model_type="browser_use": a browser-use agent in a local (or cloud) browser.
browser = ["promptmap-extra-model-kinds[browser]; python_version >= '3.11'"]
# agent_multi_harness's opencode / pi: npm-install their CLIs on first use.
npm = ["promptmap-extra-model-kinds[npm]>=0.7.4; python_version >= '3.12'"]

[project.scripts]
promptmap = "promptmap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptmap*"]

[tool.setuptools.package-data]
"promptmap" = ["html_templates/*.html"]

[dependency-groups]
dev = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "openai>=2.26.0",
    "python-multipart>=0.0.22",
    "google-genai>=1.0",
]

[tool.uv.sources]
promptmap-extra-model-kinds = { path = "promptmap-extra-model-kinds", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
