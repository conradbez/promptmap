[project]
name = "promptmap-code"
version = "0.2.4"
description = "pm-code: pick a promptmap chat, talk it through, and turn its final answer into coding agents and more chats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "promptmap>=0.9.4",
    # model_type="chat" lives here.
    "promptmap-extra-model-kinds>=0.8.1",
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/conradbez/promptmap"

[project.scripts]
pm-code = "promptmap_code.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
promptmap = { path = "..", editable = true }
promptmap-extra-model-kinds = { path = "../promptmap-extra-model-kinds", editable = true }
